name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  native:
    name: Native C tests (ASan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build native tests with sanitizers
        run: >-
          gcc -std=c99 -g -O1
          -fsanitize=address,signed-integer-overflow -fno-sanitize-recover=all
          -Isrc src/resize.c test/native/resize_test.c -lm
          -o "$RUNNER_TEMP/resize_test"

      - name: Run native tests
        run: $RUNNER_TEMP/resize_test

  build-fresh-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: ios, swiftpm: "true" }
          - { os: macos-latest, target: ios, swiftpm: "false" }
          - { os: ubuntu-latest, target: android, swiftpm: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash .github/scripts/build_fresh_app.sh ${{ matrix.target }} ${{ matrix.swiftpm }}
